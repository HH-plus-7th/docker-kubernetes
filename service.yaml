apiVersion: v1
kind: Service
metadata:
  name: doku-app-clusterip
spec:
  type: ClusterIP
  selector:
    app: doku-app
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: doku-app-nodeport
spec:
  type: NodePort
  selector:
    app: doku-app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
