apiVersion: apps/v1
kind: Deployment
metadata:
  name: # 디플로이먼트 이름
spec:
  replicas: # 파드 개수
  selector:
    matchLabels:
      app: # 셀렉터 레이블
  template:
    metadata:
      labels:
        app: # 파드 레이블 (selector와 일치해야 해요!)
    spec:
      containers:
        - name: # 컨테이너 이름
          image: # 사용할 이미지
          ports:
            - containerPort: # 컨테이너 포트
